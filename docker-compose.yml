services:
  api:
    build: .
    container_name: classificador-api
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: classificador-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # Permite usar {{ $env.WHATSAPP_VERIFY_TOKEN }} no fluxo, sem gravar o token dentro do workflow.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - api
    restart: unless-stopped

  # Opcional, só para receber mensagens reais do WhatsApp: cria um endereço público HTTPS
  # temporário que aponta para o n8n (a Meta só entrega mensagens em HTTPS público).
  #   subir:         docker compose --profile whatsapp up -d
  #   ver endereço:  docker compose logs tunel
  # Enquanto estiver no ar, o n8n fica acessível pela internet: use uma senha forte e desligue depois.
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: classificador-tunel
    command: tunnel --no-autoupdate --url http://n8n:5678
    profiles: ["whatsapp"]
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  n8n_data:
